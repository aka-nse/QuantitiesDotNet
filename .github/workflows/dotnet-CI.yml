name: .NET Core CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    runs-on: [windows-latest]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Restore dependencies
      run: dotnet restore QuantitiesDotNet.slnx

    - name: Build solution
      run: dotnet build QuantitiesDotNet.slnx --no-restore

    - name: Run tests
      run: dotnet test QuantitiesDotNet.slnx --no-build --verbosity normal
